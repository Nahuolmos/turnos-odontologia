name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run MyPy
        run: mypy app/

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-fail-under=50

      - name: Docker Compose smoke test
        run: |
          docker compose -f ../docker-compose.ci.yml up -d
          sleep 30
          curl -f http://localhost:8000/api/health || (docker compose -f ../docker-compose.ci.yml logs api && exit 1)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/turnos_odontologia
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: dev-secret-change-in-production
          JWT_EXPIRES_MIN: 30
          TZ_CLINICA: America/Argentina/Buenos_Aires
          FRONTEND_URL: http://localhost:5173
          LOG_LEVEL: INFO

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true